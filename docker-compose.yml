name: app-starter

# Only the database runs in a container during development. The application runs natively
# (`pnpm dev`), because containerising Next.js locally costs hot reload and buys nothing.
#
# The port is 5433 deliberately, so a PostgreSQL service already owning 5432 is left alone.

services:
   db:
      image: postgres:18-alpine
      container_name: app-starter-db
      restart: unless-stopped
      environment:
         POSTGRES_DB: ${POSTGRES_DB:-app}
         POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
         # C.UTF-8 rather than a language locale: collation affects index order and therefore
         # query plans, so development and production must not differ on it.
         POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
         APP_DB_USER: ${APP_DB_USER:-app_user}
         APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_user}
         MIGRATE_DB_USER: ${MIGRATE_DB_USER:-app_migrator}
         MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-app_migrator}
      ports:
         - '${POSTGRES_PORT:-5433}:5432'
      volumes:
         # The image declares /var/lib/postgresql as its volume and puts the cluster in
         # /var/lib/postgresql/18/docker. This moved in 18: mounting the old
         # /var/lib/postgresql/data persists an empty directory and loses every write on restart.
         - pgdata:/var/lib/postgresql
         - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-app}']
         interval: 5s
         timeout: 3s
         retries: 20
         start_period: 10s

volumes:
   pgdata:
      name: app-starter-pgdata
